<!-- CARD Desafio -->
<div class="d-flex justify-content-center w-100 mt-2">
  <div class="card w-75 border-dark-subtle">
    <h5 class="card-header grad-bg">Desafio</h5>
    <div class="card-body">
      
      <!-- SELEÇÃO DE PERSONAGENS E ATRIBUTOS -->
      <div class="row">
        <div class="col">
          <label for="personagem">Personagem</label>
          <select class="form-control" id="personagem" name="Personagem"></select>
        </div>

        <div class="col">
          <label for="atributo">Atributo a Comparar</label>
          <select class="form-control" id="atributo" name="Atributo">
            <option value="forca" selected>Força</option>
            <option value="destreza">Destreza</option>
            <option value="percepcao">Percepção</option>
            <option value="carisma">Carisma</option>
            <option value="inteligencia">Inteligência</option>
          </select>
        </div>
        <div class="col">
          <label for="nivelDesafio">Dificuldade</label>
          <select class="form-control" id="nivelDesafio" name="NivelDesafio">
            <option value="1" selected>Nível 1</option>
            <option value="2">Nível 2</option>
            <option value="3">Nível 3</option>
            <option value="4">Nível 4</option>
            <option value="5">Nível 5</option>
            <option value="6">Nível 6</option>
            <option value="7">Nível 7</option>
            <option value="8">Nível 8</option>
            <option value="9">Nível 9</option>
            <option value="10">Nível 10</option>
          </select>
        </div>
      </div>

      <!-- ATRIBUTOS DE PERSONAGENS, DADOS E RESULTADOS -->
      <div class="row mt-2">
        
        <!-- PERSONAGEM -->
        <div class="col">
          <div class="card border-dark-subtle" id="cardPersonagem">
            <div class="card-header grad-bg">
              <h5 class="card-title" title="Nenhum personagem criado">Nenhum personagem criado</h5>
              <h6 class="card-subtitle">Crie um personagem em "Personagens"</h6>
            </div>
            <div class="card-body">
              <p class="mb-1">Força: <span class="fw-semibold"></span></p>
              <p class="mb-1">Destreza: <span class="fw-semibold"></span></p>
              <p class="mb-1">Percepção: <span class="fw-semibold"></span></p>
              <p class="mb-1">Carisma: <span class="fw-semibold"></span></p>
              <p class="mb-1">Inteligência: <span class="fw-semibold"></span></p>
            </div>
          </div>
        </div>

        <!-- ROLAGEM DE DADOS E RESULTADO -->
        <div class="col">
          <div class="card text-center border-dark-subtle">
            
            <div class="card-body d-flex flex-column align-items-center">
              <h5 class="card-title">Rolagem dos Dados</h5>

              <div class="d-flex row justify-content-center w-100">

                <!-- DADO PERSONAGEM -->
                <div class="col-3 d-flex justify-content-center p-0 mx-2">
                  <div class="border border-secondary rounded-5 d-flex justify-content-center align-items-center"
                    style="width: 4rem; height: 4rem;">
                    <p class="mb-1 fw-bold fs-4">
                      <span id="dadoAliado">0</span>
                    </p>
                    <p class="fs-6 text-muted">
                      <span id="atributoAliado">+0</span>
                    </p>
                  </div>
                </div>

                <!-- DIVISOR X -->
                <div class="col-3 p-0">
                  <h1 class="my-1">X</h1>
                </div>

                <!-- DADO DESAFIO -->
                <div class="col-3 d-flex justify-content-center p-0 mx-2">
                  <div class="border border-secondary rounded-5 d-flex justify-content-center align-items-center"
                    style="width: 4rem; height: 4rem;">
                    <p class="mb-1 fw-bold fs-4">
                      <span id="dadoDesafio">0</span>
                    </p>
                    <p class="fs-6 text-muted">
                      <span id="valorDesafio">+0</span>
                    </p>
                  </div>
                </div>

              </div>

              <!-- BOTÃO ROLAR -->
              <a href="#" class="btn accent-bg" id="botaoDesafio">Rolar</a>
            </div>

            <!-- RESULTADO -->
            <div class="card-footer">
              <p class="m-0 d-flex flex-column align-items-center">Resultado: <span class="fw-semibold" id="resultado"></span></p>
            </div>
          </div>
        </div>

        <!-- DESAFIO -->
        <div class="col">
          <div class="card border-dark-subtle" id="cardDesafio">
            <div class="card-header grad-bg">
              <h5 class="card-title">Desafio</h5>
              <h6 class="card-subtitle">Desafio nível: <span class="fw-semibold" id="nivelEscolhido">1</span></h6>
            </div>
            <div class="card-body">
              <p id="atributoEscolhido">Dificuldade: <span class="fw-semibold" id="dificuldade"></span></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
